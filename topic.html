<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UCVM Learning Outcomes — Topic</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="save-toast" style="display:none; position:fixed; bottom:24px; right:24px; background:var(--color-success); color:#fff; padding:10px 18px; border-radius:var(--radius-md); box-shadow:var(--shadow-card-hover); font-weight:600; z-index:1000;">✓ Saved</div>
  <div class="topbar">
    <h1>UCVM Learning Outcomes</h1>
    <a href="dashboard.html" style="color:#fff;">← Back to my dashboard</a>
  </div>

  <div class="main-content">
    <div class="card mb-4">
      <div class="flex-between" style="align-items:flex-start; flex-wrap:wrap; gap:12px;">
        <div>
          <span class="text-muted" id="topic-breadcrumb"></span>
          <h2 id="topic-title" style="margin-top:4px;">Loading...</h2>
          <span class="badge" id="topic-status-badge"></span>
        </div>
        <div class="flex gap-2" id="topic-nav" style="flex-shrink:0;"></div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 24px;">
      <div class="card">
        <h3 id="outcomes-heading" class="section-heading"><span class="icon">📋</span> Learning outcomes</h3>

        <div class="table-scroll">
          <table class="outcomes-table" id="outcomes-table">
            <thead>
              <tr>
                <th style="width:32px;">#</th>
                <th>Learning outcome</th>
                <th style="width:150px;">Species</th>
                <th style="width:170px;">Organ system</th>
                <th style="width:64px;"></th>
              </tr>
            </thead>
            <tbody id="outcomes-tbody"></tbody>
          </table>
        </div>

        <div class="mt-4" style="padding-top:var(--space-4); border-top:1px solid var(--color-border);">
          <label for="add-outcomes-text" class="section-heading" style="font-size:var(--font-size-md);"><span class="icon">✏️</span> Add outcomes</label>
          <textarea id="add-outcomes-text" class="mt-2" style="min-height:80px;" placeholder="Type one, or paste your whole list here (one per line)..."></textarea>
          <div class="flex-between mt-2" style="align-items:center;">
            <button class="btn btn-primary" id="btn-add-outcomes">+ Add outcome</button>
            <p id="outcome-msg" class="text-muted" style="margin:0;"></p>
          </div>
        </div>
      </div>

      <div>
        <div class="card mb-4">
          <h3 class="section-heading"><span class="icon">👥</span> Collaborators</h3>
          <div id="collaborators-list" class="mt-2"></div>
        </div>
        <div class="card">
          <h3 class="section-heading"><span class="icon">🕐</span> Recent activity</h3>
          <div id="activity-feed" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logic for this page: real-time shared outcomes.
       Identity -> app.js. Everything about outcomes/activity -> dataEngine.js -->
  <script type="module">
    import { onAuthChange, getCurrentInstructor, getAllInstructors } from "./app.js";
    import { listenToTopic, addOutcomesBulk, updateOutcome, deleteOutcome, getTopicsForInstructor } from "./dataEngine.js";

    const SPECIES_LIST = [
      "Equine", "Bovine", "Small Animal", "Wildlife", "Lab Animal", "Exotics",
      "Other Livestock", "All/multiple/comparative", "N/A",
    ];
    const ORGAN_SYSTEM_LIST = [
      "Respiratory system", "Integumentary System", "Musculoskeletal System", "Nervous System",
      "Endocrine System", "Cardiovascular System", "Hematolymphatic System", "Digestive System",
      "Urinary System", "Reproductive System", "Sensory system", "Hepatobiliary System",
      "Multiple System", "All / systemic", "N/A",
    ];

    // Drawn icons (not an icon font) so they always render, on any device.
    const ICON_EDIT = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`;
    const ICON_DELETE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

    const $ = (id) => document.getElementById(id);

    function optionsHtml(list, selected, placeholder) {
      const opts = [`<option value="" ${!selected ? "selected" : ""}>${placeholder}</option>`];
      for (const item of list) {
        opts.push(`<option value="${item}" ${selected === item ? "selected" : ""}>${item}</option>`);
      }
      return opts.join("");
    }

    let saveToastTimeout;
    function showSaved() {
      const toast = $("save-toast");
      toast.style.display = "block";
      clearTimeout(saveToastTimeout);
      saveToastTimeout = setTimeout(() => { toast.style.display = "none"; }, 1500);
    }

    const topicId = new URLSearchParams(window.location.search).get("id");
    let currentInstructor = null;
    let unsubscribe = null;
    let latestTopic = null;
    let justAddedNumbers = new Set(); // briefly highlights newly added rows

    function timeAgo(ts) {
      if (!ts) return "";
      const date = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
      const diffMin = Math.round((Date.now() - date.getTime()) / 60000);
      if (diffMin < 1) return "just now";
      if (diffMin < 60) return `${diffMin} min ago`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `${diffH} h ago`;
      return date.toLocaleDateString();
    }

    // Splits pasted text into individual outcome lines, stripping
    // leading numbering/bullets like "1." "1)" "-" "•". Works the
    // same whether there's one line or many — no mode to choose.
    function parseOutcomeLines(text) {
      return text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line.length > 0)
        .map((line) => line.replace(/^(\d+[.)]|[-•*])\s*/, "").trim())
        .filter((line) => line.length > 0);
    }

    async function saveField(outcomeNumber, changes) {
      const current = (latestTopic.outcomes || []).find((o) => o.outcomeNumber === outcomeNumber);
      if (!current) return;
      await updateOutcome(topicId, outcomeNumber, {
        text: current.text,
        species: current.species || "",
        organSystem: current.organSystem || "",
        ...changes,
        instructorId: currentInstructor.instructorId,
        instructorName: currentInstructor.name,
      });
      showSaved();
    }

    function renderOutcomes(topic) {
      const tbody = $("outcomes-tbody");
      const outcomes = topic.outcomes || [];

      if (outcomes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-muted" style="padding:var(--space-4) 0;">No outcomes yet — add the first one below.</td></tr>`;
        return;
      }

      tbody.innerHTML = outcomes
        .map((o) => {
          const rowClass = justAddedNumbers.has(o.outcomeNumber) ? "outcome-just-added" : "";
          const sameAuthor = o.createdByName === o.updatedByName;
          const metaText = sameAuthor
            ? `By ${o.createdByName} · ${timeAgo(o.updatedAt)}`
            : `Added by ${o.createdByName}, updated by ${o.updatedByName} · ${timeAgo(o.updatedAt)}`;
          return `
        <tr data-num="${o.outcomeNumber}" class="${rowClass}">
          <td><div class="outcome-num-badge" style="width:22px; height:22px; font-size:11px;">${o.outcomeNumber}</div></td>
          <td class="outcome-text-cell">
            <div class="outcome-text-display">
              <span>${o.text}</span>
              <div class="outcome-meta">${metaText}</div>
              <button class="icon-btn icon-btn-flat edit-text-btn mt-1" data-num="${o.outcomeNumber}" title="Edit text" aria-label="Edit text">${ICON_EDIT}</button>
            </div>
          </td>
          <td><select class="species-select ${!o.species ? "needs-input" : ""}" data-num="${o.outcomeNumber}">${optionsHtml(SPECIES_LIST, o.species, "Select...")}</select></td>
          <td><select class="system-select ${!o.organSystem ? "needs-input" : ""}" data-num="${o.outcomeNumber}">${optionsHtml(ORGAN_SYSTEM_LIST, o.organSystem, "Select...")}</select></td>
          <td><button class="icon-btn icon-btn-flat icon-btn-danger delete-outcome" data-num="${o.outcomeNumber}" title="Delete" aria-label="Delete outcome">${ICON_DELETE}</button></td>
        </tr>
      `;
        })
        .join("");

      tbody.querySelectorAll(".species-select").forEach((sel) => {
        sel.addEventListener("change", () => {
          sel.classList.toggle("needs-input", !sel.value);
          saveField(Number(sel.dataset.num), { species: sel.value });
        });
      });
      tbody.querySelectorAll(".system-select").forEach((sel) => {
        sel.addEventListener("change", () => {
          sel.classList.toggle("needs-input", !sel.value);
          saveField(Number(sel.dataset.num), { organSystem: sel.value });
        });
      });
      tbody.querySelectorAll(".delete-outcome").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!window.confirm("Delete this learning outcome?")) return;
          await deleteOutcome(topicId, Number(btn.dataset.num), { instructorId: currentInstructor.instructorId, instructorName: currentInstructor.name });
          showSaved();
        });
      });
      tbody.querySelectorAll(".edit-text-btn").forEach((btn) => {
        btn.addEventListener("click", () => startEditingText(Number(btn.dataset.num)));
      });
    }

    function startEditingText(num) {
      const current = (latestTopic.outcomes || []).find((o) => o.outcomeNumber === num);
      const cell = document.querySelector(`tr[data-num="${num}"] .outcome-text-cell .outcome-text-display`);
      if (!current || !cell) return;

      cell.innerHTML = `
        <textarea class="edit-text-input" style="min-height:70px;">${current.text}</textarea>
        <div class="flex gap-2 mt-2">
          <button class="btn btn-primary save-text-btn" style="font-size:0.8rem; padding:6px 14px;">Save</button>
          <button class="btn btn-secondary cancel-text-btn" style="font-size:0.8rem; padding:6px 14px;">Cancel</button>
        </div>
      `;
      cell.querySelector(".cancel-text-btn").addEventListener("click", () => renderOutcomes(latestTopic));
      cell.querySelector(".save-text-btn").addEventListener("click", async () => {
        const text = cell.querySelector(".edit-text-input").value.trim();
        if (!text) return;
        await saveField(num, { text });
      });
    }

    function renderActivity(topic) {
      const history = topic.activityHistory || [];
      $("activity-feed").innerHTML =
        history.map((a) => `<div class="activity-item"><strong>${a.instructorName}</strong>&nbsp;${a.action} · <span class="text-muted">${timeAgo(a.timestamp)}</span></div>`).join("") ||
        `<p class="text-muted">No activity yet.</p>`;
    }

    async function renderCollaborators(topic) {
      const all = await getAllInstructors();
      const byId = new Map(all.map((i) => [i.instructorId, i]));
      const names = (topic.assignedInstructorIDs || []).map((id) => byId.get(id)?.name || id);
      $("collaborators-list").innerHTML = names.map((n) => `<div>${n}</div>`).join("");
    }

    function renderHeader(topic) {
      $("topic-breadcrumb").textContent = `${topic.academicYear} · Course ${topic.course}`;
      $("topic-title").textContent = topic.topicName;
      const badge = $("topic-status-badge");
      badge.textContent = topic.completionStatus.replace("_", " ");
      badge.className = `badge badge-${topic.completionStatus.replace("_", "-")}`;
    }

    $("btn-add-outcomes").addEventListener("click", async () => {
      const lines = parseOutcomeLines($("add-outcomes-text").value);
      if (lines.length === 0) {
        $("outcome-msg").textContent = "Type or paste at least one outcome first.";
        return;
      }
      $("outcome-msg").textContent = "Saving...";
      try {
        const startNum = (latestTopic.outcomes || []).length + 1;
        await addOutcomesBulk(topicId, lines, {
          species: "",
          organSystem: "",
          instructorId: currentInstructor.instructorId,
          instructorName: currentInstructor.name,
        });
        justAddedNumbers = new Set(lines.map((_, i) => startNum + i));
        setTimeout(() => { justAddedNumbers = new Set(); renderOutcomes(latestTopic); }, 2500);
        $("add-outcomes-text").value = "";
        $("outcome-msg").textContent = "";
        showSaved();
      } catch (err) {
        $("outcome-msg").textContent = err.message;
      }
    });

    async function renderTopicNav() {
      const myTopics = await getTopicsForInstructor(currentInstructor.instructorId);
      myTopics.sort((a, b) =>
        a.academicYear.localeCompare(b.academicYear) ||
        String(a.course).localeCompare(String(b.course)) ||
        a.topicName.localeCompare(b.topicName)
      );
      const idx = myTopics.findIndex((t) => t.id === topicId);
      if (idx === -1) return;

      const prev = idx > 0 ? myTopics[idx - 1] : null;
      const next = idx < myTopics.length - 1 ? myTopics[idx + 1] : null;

      $("topic-nav").innerHTML = `
        <span class="text-muted" style="font-size:0.85rem; align-self:center;">${idx + 1} of ${myTopics.length}</span>
        ${prev ? `<a href="topic.html?id=${prev.id}" class="btn btn-secondary" style="font-size:0.85rem; padding:6px 12px;">‹ Previous</a>` : ""}
        ${next ? `<a href="topic.html?id=${next.id}" class="btn btn-secondary" style="font-size:0.85rem; padding:6px 12px;">Next ›</a>` : ""}
      `;
    }

    onAuthChange(async (user) => {
      if (!user || !topicId) { window.location.href = "index.html"; return; }
      currentInstructor = await getCurrentInstructor(user);
      if (!currentInstructor) { window.location.href = "index.html"; return; }

      renderTopicNav();

      if (unsubscribe) unsubscribe();
      unsubscribe = listenToTopic(topicId, (topic) => {
        latestTopic = topic;
        renderHeader(topic);
        renderOutcomes(topic);
        renderActivity(topic);
        renderCollaborators(topic);
      });
    });
  </script>
</body>
</html>
