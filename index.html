<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UCVM Learning Outcomes — Faculty Sign In</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container-centered">
    <div class="card" style="width: 100%; max-width: 420px;">
      <h1 style="text-align:center;">UCVM Learning Outcomes</h1>
      <p class="text-muted" style="text-align:center;">Instructor Topic Outcomes Collection</p>

      <div id="step-choice">
        <button class="btn btn-primary btn-block mt-4" id="btn-show-email">Sign in with my email</button>
        <button class="btn btn-secondary btn-block mt-2" id="btn-show-guest">Continue as guest</button>
      </div>

      <div id="step-email" style="display:none;">
        <div class="form-group mt-4">
          <label for="email-input">Assigned email</label>
          <input type="email" id="email-input" placeholder="nombre@ejemplo.com" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-send-link">Send access link</button>
        <p id="email-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-1">Back</button>
      </div>

      <div id="step-guest-code" style="display:none;">
        <div class="form-group mt-4">
          <label for="guest-year">Academic year</label>
          <select id="guest-year">
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="guest-code">Access code</label>
          <input type="text" id="guest-code" placeholder="Academic year code" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-validate-code">Continue</button>
        <p id="guest-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-2">Back</button>
      </div>

      <div id="step-guest-search" style="display:none;">
        <div class="form-group mt-4">
          <label for="guest-name-search">Search your name</label>
          <input type="search" id="guest-name-search" placeholder="Type your name..." />
        </div>
        <div id="guest-results"></div>
      </div>
    </div>
  </div>

  <!-- Logic for this page: email + guest login. Everything shared
       (sending the link, validating the code, session) lives in app.js -->
  <script type="module">
    import {
      requestInstructorLoginLink,
      completeInstructorLoginIfNeeded,
      validateGuestCode,
      startGuestSession,
      setGuestInstructorId,
      searchInstructorsByName,
      onAuthChange,
    } from "./app.js";

    const $ = (id) => document.getElementById(id);

    function showStep(id) {
      ["step-choice", "step-email", "step-guest-code", "step-guest-search"].forEach((s) => {
        $(s).style.display = s === id ? "block" : "none";
      });
    }

    $("btn-show-email").addEventListener("click", () => showStep("step-email"));
    $("btn-show-guest").addEventListener("click", () => showStep("step-guest-code"));
    $("btn-back-1").addEventListener("click", () => showStep("step-choice"));
    $("btn-back-2").addEventListener("click", () => showStep("step-choice"));

    $("btn-send-link").addEventListener("click", async () => {
      $("email-msg").textContent = "Sending...";
      try {
        await requestInstructorLoginLink($("email-input").value);
        $("email-msg").textContent = "Link sent. Check your email and click the link to sign in.";
      } catch (err) {
        $("email-msg").textContent = err.message;
      }
    });

    completeInstructorLoginIfNeeded().then((user) => {
      if (user) window.location.href = "dashboard.html";
    });

    let selectedYear = null;

    $("btn-validate-code").addEventListener("click", async () => {
      $("guest-msg").textContent = "Validating...";
      try {
        const year = $("guest-year").value;
        await validateGuestCode(year, $("guest-code").value);
        await startGuestSession(year);
        selectedYear = year;
        $("guest-msg").textContent = "";
        showStep("step-guest-search");
      } catch (err) {
        $("guest-msg").textContent = err.message;
      }
    });

    let searchTimeout;
    $("guest-name-search").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      const term = e.target.value.trim();
      if (term.length < 2) { $("guest-results").innerHTML = ""; return; }
      searchTimeout = setTimeout(async () => {
        const matches = await searchInstructorsByName(term);
        $("guest-results").innerHTML = matches
          .map((m) => `<button class="btn btn-secondary btn-block mt-2 guest-pick" data-id="${m.instructorId}">${m.name}</button>`)
          .join("") || `<p class="text-muted mt-2">No results.</p>`;

        document.querySelectorAll(".guest-pick").forEach((btn) => {
          btn.addEventListener("click", () => {
            setGuestInstructorId(btn.dataset.id);
            window.location.href = "dashboard.html";
          });
        });
      }, 250);
    });

    onAuthChange((user) => {
      if (user && !user.isAnonymous) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
