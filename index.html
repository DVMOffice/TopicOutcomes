<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning Outcomes Collection System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container-centered">
    <div class="card" style="width: 100%; max-width: 420px;">
      <h1 style="text-align:center;">Learning Outcomes</h1>
      <p class="text-muted" style="text-align:center;">Sistema de recolección de resultados de aprendizaje</p>

      <div id="step-choice">
        <button class="btn btn-primary btn-block mt-4" id="btn-show-email">Iniciar sesión con mi correo</button>
        <button class="btn btn-secondary btn-block mt-2" id="btn-show-guest">Continuar como invitado</button>
      </div>

      <div id="step-email" style="display:none;">
        <div class="form-group mt-4">
          <label for="email-input">Correo asignado</label>
          <input type="email" id="email-input" placeholder="nombre@ejemplo.com" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-send-link">Enviar enlace de acceso</button>
        <p id="email-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-1">Volver</button>
      </div>

      <div id="step-guest-code" style="display:none;">
        <div class="form-group mt-4">
          <label for="guest-year">Año académico</label>
          <select id="guest-year">
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="guest-code">Código de acceso</label>
          <input type="text" id="guest-code" placeholder="Código del año académico" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-validate-code">Continuar</button>
        <p id="guest-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-2">Volver</button>
      </div>

      <div id="step-guest-search" style="display:none;">
        <div class="form-group mt-4">
          <label for="guest-name-search">Busca tu nombre</label>
          <input type="search" id="guest-name-search" placeholder="Escribe tu nombre..." />
        </div>
        <div id="guest-results"></div>
      </div>
    </div>
  </div>

  <!-- Lógica de esta página: login por correo + invitado. Todo lo compartido
       (envío de enlace, validación de código, sesión) vive en app.js -->
  <script type="module">
    import {
      requestInstructorLoginLink,
      completeInstructorLoginIfNeeded,
      validateGuestCode,
      startGuestSession,
      setGuestInstructorId,
      searchInstructorsByName,
      onAuthChange,
    } from "./app.js";

    const $ = (id) => document.getElementById(id);

    function showStep(id) {
      ["step-choice", "step-email", "step-guest-code", "step-guest-search"].forEach((s) => {
        $(s).style.display = s === id ? "block" : "none";
      });
    }

    $("btn-show-email").addEventListener("click", () => showStep("step-email"));
    $("btn-show-guest").addEventListener("click", () => showStep("step-guest-code"));
    $("btn-back-1").addEventListener("click", () => showStep("step-choice"));
    $("btn-back-2").addEventListener("click", () => showStep("step-choice"));

    $("btn-send-link").addEventListener("click", async () => {
      $("email-msg").textContent = "Enviando...";
      try {
        await requestInstructorLoginLink($("email-input").value);
        $("email-msg").textContent = "Enlace enviado. Revisa tu correo y haz clic en el enlace para entrar.";
      } catch (err) {
        $("email-msg").textContent = err.message;
      }
    });

    completeInstructorLoginIfNeeded().then((user) => {
      if (user) window.location.href = "dashboard.html";
    });

    let selectedYear = null;

    $("btn-validate-code").addEventListener("click", async () => {
      $("guest-msg").textContent = "Validando...";
      try {
        const year = $("guest-year").value;
        await validateGuestCode(year, $("guest-code").value);
        await startGuestSession(year);
        selectedYear = year;
        $("guest-msg").textContent = "";
        showStep("step-guest-search");
      } catch (err) {
        $("guest-msg").textContent = err.message;
      }
    });

    let searchTimeout;
    $("guest-name-search").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      const term = e.target.value.trim();
      if (term.length < 2) { $("guest-results").innerHTML = ""; return; }
      searchTimeout = setTimeout(async () => {
        const matches = await searchInstructorsByName(term);
        $("guest-results").innerHTML = matches
          .map((m) => `<button class="btn btn-secondary btn-block mt-2 guest-pick" data-id="${m.instructorId}">${m.name}</button>`)
          .join("") || `<p class="text-muted mt-2">Sin resultados.</p>`;

        document.querySelectorAll(".guest-pick").forEach((btn) => {
          btn.addEventListener("click", () => {
            setGuestInstructorId(btn.dataset.id);
            window.location.href = "dashboard.html";
          });
        });
      }, 250);
    });

    onAuthChange((user) => {
      if (user && !user.isAnonymous) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
