<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UCVM Learning Outcomes — Sign In</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container-centered">
    <div class="card" style="width: 100%; max-width: 420px;">
      <h1 style="text-align:center;">UCVM Learning Outcomes</h1>
      <p class="text-muted" style="text-align:center;">Instructor Topic Outcomes Collection</p>

      <div id="step-search">
        <div class="form-group mt-4">
          <label for="name-search">🔍 Search your name</label>
          <input type="search" id="name-search" placeholder="Start typing your name..." autofocus />
        </div>
        <div id="search-results"></div>
        <p class="text-muted mt-4" style="text-align:center; font-size: 0.8rem;">
          <a href="#" id="link-show-team">Support team access</a>
          &nbsp;·&nbsp;
          <a href="#" id="link-show-admin">Administrator access</a>
        </p>
      </div>

      <div id="step-team" style="display:none;">
        <div class="form-group mt-4">
          <label for="team-select">Your team</label>
          <select id="team-select">
            <option value="Team A">Team A</option>
            <option value="Team B">Team B</option>
            <option value="Team C">Team C</option>
            <option value="Team D">Team D</option>
          </select>
        </div>
        <div class="form-group">
          <label for="team-code">Team code</label>
          <input type="text" id="team-code" placeholder="Team code" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-team-continue">Continue</button>
        <p id="team-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-team">Back</button>
      </div>

      <div id="step-admin" style="display:none;">
        <div class="form-group mt-4">
          <label for="admin-code">Administrator code</label>
          <input type="text" id="admin-code" placeholder="Admin code" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-admin-continue">Continue</button>
        <p id="admin-msg" class="text-muted mt-2"></p>
        <button class="btn btn-secondary btn-block mt-2" id="btn-back-admin">Back</button>
      </div>
    </div>
  </div>

  <!-- Logic for this page: instructor name search + team code + admin code.
       Everything shared lives in app.js -->
  <script type="module">
    import {
      searchInstructorsByName,
      signInAsInstructor,
      signInAsAdmin,
      signInAsTeam,
    } from "./app.js";

    const $ = (id) => document.getElementById(id);

    function showStep(id) {
      ["step-search", "step-team", "step-admin"].forEach((s) => {
        $(s).style.display = s === id ? "block" : "none";
      });
    }

    $("link-show-team").addEventListener("click", (e) => { e.preventDefault(); showStep("step-team"); });
    $("link-show-admin").addEventListener("click", (e) => { e.preventDefault(); showStep("step-admin"); });
    $("btn-back-team").addEventListener("click", () => showStep("step-search"));
    $("btn-back-admin").addEventListener("click", () => showStep("step-search"));

    // --- Instructor: search name, click it, done ---
    let searchTimeout;
    $("name-search").addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      const term = e.target.value.trim();
      if (term.length < 2) { $("search-results").innerHTML = ""; return; }
      searchTimeout = setTimeout(async () => {
        const matches = await searchInstructorsByName(term);
        $("search-results").innerHTML = matches
          .map((m) => `<button class="btn btn-secondary btn-block mt-2 name-pick" data-id="${m.instructorId}">${m.name}</button>`)
          .join("") || `<p class="text-muted mt-2">No results.</p>`;

        document.querySelectorAll(".name-pick").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await signInAsInstructor(btn.dataset.id);
            window.location.href = "dashboard.html";
          });
        });
      }, 250);
    });

    // --- Support team code ---
    $("btn-team-continue").addEventListener("click", async () => {
      $("team-msg").textContent = "Checking...";
      try {
        await signInAsTeam($("team-select").value, $("team-code").value);
        window.location.href = "team-dashboard.html";
      } catch (err) {
        $("team-msg").textContent = err.message;
      }
    });

    // --- Admin code ---
    $("btn-admin-continue").addEventListener("click", async () => {
      $("admin-msg").textContent = "Checking...";
      try {
        await signInAsAdmin($("admin-code").value);
        window.location.href = "admin.html";
      } catch (err) {
        $("admin-msg").textContent = err.message;
      }
    });

  </script>
</body>
</html>
